services:
  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    volumes:
      - ./policy:/policy
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level=debug", "/policy"]

  bifrost:
    image: custom-bifrost:latest
    ports:
      - "8081:8080" # Bifrost gateway on 8081
    volumes:
      - ./data:/app/data
    restart: always
