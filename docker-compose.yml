services:
  postgres:
    image: postgres:15-alpine
    container_name: custom-ai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: custom_ai
    ports:
      - "5432:5432"
    volumes:
      - ./schema:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    volumes:
      - ./policy:/policy
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "--log-level=debug", "/policy"]

  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "8081:8080" # Bifrost gateway on 8081
    volumes:
      - ./data:/app/data
    restart: always
